# Parts based on https://github.com/lexbritvin/os-info-action/blob/main/action.yml

name: Detect OS
description: 'Detect the system OS'

outputs:
  platform:
    description: 'OS Name (linux/windows/macos)'
    value: ${{ steps.detect-os.outputs.platform }}
  architecture:
    description: 'System Architecture (x86_64, etc)'
    value: ${{ steps.detect-os.outputs.architecture }}
  godot-os:
    description: 'The file extension needed to download Godot'
    value: ${{ steps.detect-os.outputs.godot-os }}

runs:
  using: composite
  steps:
    - name: Detect OS
      id: detect-os
      shell: bash
      run: |
        OS_NAME=""
        ARCHITECTURE=""
        GODOT_OS=""
        
        # Detect OS and collect information
        if [[ "${{ runner.os }}" == "Linux" ]]; then
          OS_NAME="linux"
          RAW_ARCH=$(uname -m)        
        elif [[ "${{ runner.os }}" == "macOS" ]]; then
          OS_NAME="macos"
          RAW_ARCH=$(uname -m)        
        elif [[ "${{ runner.os }}" == "Windows" ]]; then
          OS_NAME="windows"
          if command -v systeminfo &> /dev/null; then
            RAW_ARCH=$(systeminfo | grep "System Type" | cut -d: -f2 | xargs)
          else
            RAW_ARCH="x64-based PC"  # Default assumption
          fi
        fi
        
        # Normalize architecture across platforms
        case "$RAW_ARCH" in
          "x86_64"|"amd64"|"x64-based PC"|"AMD64")
            ARCHITECTURE="x86_64"
            ;;
          "aarch64"|"arm64"|"ARM64-based PC")
            ARCHITECTURE="arm64"
            ;;
          "i386"|"i686"|"x86-based PC"|"X86")
            ARCHITECTURE="x86"
            ;;
          "armv7l"|"armv6l")
            ARCHITECTURE="arm"
            ;;
          *)
            ARCHITECTURE="$RAW_ARCH"  # Keep original if unknown
            ;;
        esac
        
        if [[ "$OS_NAME" == "windows" ]]; then
          if [[ "$ARCHITECTURE" == "x86_64" ]]; then
            GODOT_OS="win64.exe"
          elif [[ "$ARCHITECTURE" == "x86" ]]; then
            GODOT_OS="win32.exe"
          elif [[ "$ARCHITECTURE" == "arm64" ]]; then
            GODOT_OS="windows_arm64"
          fi
        elif [[ "$OS_NAME" == "linux" ]]; then
          if [[ "$ARCHITECTURE" == "x86_64" ]]; then
            GODOT_OS="linux.x86_64"
          elif [[ "$ARCHITECTURE" == "x86" ]]; then
            GODOT_OS="linux.x86_32"
          elif [[ "$ARCHITECTURE" == "arm64" ]]; then
            GODOT_OS="linux.arm64"
          elif [[ "$ARCHITECTURE" == "arm" ]]; then
            GODOT_OS="linux.arm32"
          fi
        elif [[ "$OS_NAME" == "macos" ]]; then
            GODOT_OS="macos.universal"
        fi


        # Set individual outputs
        echo "platform=$OS_NAME" >> $GITHUB_OUTPUT
        echo "architecture=$ARCHITECTURE" >> $GITHUB_OUTPUT
        echo "godot-os=$GODOT_OS" >> $GITHUB_OUTPUT

    - name: Display OS
      shell: bash
      run: |
        echo "Platform: ${{ steps.detect-os.outputs.platform }}"
        echo "Architecture: ${{ steps.detect-os.outputs.architecture }}"
        echo "Godot OS: ${{ steps.detect-os.outputs.godot-os }}"