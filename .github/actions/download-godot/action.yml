# Parts based on https://github.com/godot-gdunit-labs/gdUnit4-action/blob/master/.gdunit4_action/godot-install/action.yml
# Rewritten to be cross-platform.

name: install-godot
description: 'Installs Godot'

inputs:
  godot-version:
    description: 'The Godot version (e.g. 4.7.2)'
    type: string
    required: true
  godot-release-type:
    description: "The type of the release (e.g. 'stable')"
    type: string
    required: true
    default: 'stable'
  install-path:
    description: 'Where the Godot binary is installed (e.g. at godotbinary directory in your godot.workspace path)'
    type: string
    required: true
    default: '${{ github.workspace }}/godotbinary'
  platform:
    description: "The Godot download file ending (linux, macos, windows)"
    type: string
    required: true
    default: 'linux'
  architecture:
    description: 'The architecture to use (x86, x86_64, arm, arm64)'
    type: string
    required: true
    default: 'x86_64'
runs:
  using: composite
  steps:
    - name: 'Download Godot ${{ inputs.godot-version }}-${{ inputs.godot-release-type }}'
      # TODO: cache step.
      shell: bash
      run: |
        # Strict mode.
        set -euo pipefail
        IFS=$'\n\t'

        GODOT_OS=""
        GODOT_EXE=""

        case "${{ inputs.platform }}" in
          "windows")
            case "${{ inputs.architecture }}" in
              "x86_64") GODOT_OS="win64.exe" ;;
              "x86") GODOT_OS="win32.exe" ;;
              "arm64") GODOT_OS="windows_arm64" ;;
            esac ;;
          "linux")
            case "${{ inputs.architecture }}" in
              "x86_64") GODOT_OS="linux.x86_64" ;;
              "x86") GODOT_OS="linux.x86_32" ;;
              "arm64") GODOT_OS="linux.arm64" ;;
              "arm") GODOT_OS="linux.arm32" ;;
            esac ;;
          "macos")
            GODOT_OS="macos.universal" ;;
        esac


        echo "Downloading Godot ${{ inputs.godot-version}} ${{ inputs.godot-release-type}} for $GODOT_OS"

        # Make the directory to install Godot to.
        mkdir -p ${{ inputs.install-path }}
        chmod 770 ${{ inputs.install-path }}

        # Make the config directory for Godot. TODO: Test if necessary.
        # GODOT_CONFIG="$HOME/.config/godot"
        # if [ ! -d "$GODOT_CONFIG" ]; then
          # mkdir -p "GODOT_CONFIG"
          # chmod 770 "$GODOT_CONFIG"
        # fi

        GODOT_SHORTVERSION=${{ inputs.godot-version }}-${{ inputs.godot-release-type }}
        GODOT_FILENAME="Godot_v${GODOT_SHORTVERSION}_$GODOT_OS"
        GODOT_DL_ZIPNAME="$GODOT_FILENAME.zip"
        if [[ "${{ inputs.platform  }}" == "macos" ]]; then
          GODOT_EXE="Godot.app"
        else
          GODOT_EXE="$GODOT_FILENAME"
        fi
        
        GODOT_DL_URL="https://github.com/godotengine/godot/releases/download/$GODOT_SHORTVERSION/$GODOT_DL_ZIPNAME"
        cd ${{ inputs.install-path }}
        echo "Pretend - Download $GODOT_DL_ZIPNAME from $GODOT_DL_URL"
        curl -L -O "$GODOT_DL_URL"
        unzip "$GODOT_DL_ZIPNAME"
        cd -

        run_godot() {
          if [[ "${{ inputs.platform }}" == "macos" ]]; then
            # Usage: open [-e] [-t] [-f] [-W] [-R] [-n] [-g] [-h] [-s <partial SDK name>][-b <bundle identifier>] [-a <application>] [-u URL] [filenames] [--args arguments]
            # Help: Open opens files from a shell.
            #       By default, opens each file using the default application for that file.  
            #       If the file is in the form of a URL, the file will be opened as a URL.
            # Options: 
            #       -a                    Opens with the specified application.
            #       --arch ARCH           Open with the given cpu architecture type and subtype.
            #       -b                    Opens with the specified application bundle identifier.
            #       -e                    Opens with TextEdit.
            #       -t                    Opens with default text editor.
            #       -f                    Reads input from standard input and opens with TextEdit.
            #       -F  --fresh           Launches the app fresh, that is, without restoring windows. Saved persistent state is lost, excluding Untitled documents.
            #       -R, --reveal          Selects in the Finder instead of opening.
            #       -W, --wait-apps       Blocks until the used applications are closed (even if they were already running).
            #           --args            All remaining arguments are passed in argv to the application's main() function instead of opened.
            #       -n, --new             Open a new instance of the application even if one is already running.
            #       -j, --hide            Launches the app hidden.
            #       -g, --background      Does not bring the application to the foreground.
            #       -h, --header          Searches header file locations for headers matching the given filenames, and opens them.
            #       -s                    For -h, the SDK to use; if supplied, only SDKs whose names contain the argument value are searched.
            #                             Otherwise the highest versioned SDK in each platform is used.
            #       -u, --url URL         Open this URL, even if it matches exactly a filepath
            #       -i, --stdin  PATH     Launches the application with stdin connected to PATH; defaults to /dev/null
            #       -o, --stdout PATH     Launches the application with /dev/stdout connected to PATH; 
            #           --stderr PATH     Launches the application with /dev/stderr connected to PATH to
            #           --env    VAR      Add an enviroment variable to the launched process, where VAR is formatted AAA=foo or just AAA for a null string value.
            open -a ${{ inputs.install-path }}/$GODOT_EXE --stdout "${{ inputs.install-path }}/macoot" --args $@
            cat "${{ inputs.install-path }}/macoot"
          else
            ${{ inputs.install-path }}/$GODOT_EXE $@
          fi
        }

        echo "Godot ran and replied to --version with: $(run_godot --version)"
